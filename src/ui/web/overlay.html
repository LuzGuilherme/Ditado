<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>DitadoOverlay</title>
<style>
/* Pill de ditado — minimal, à Wispr Flow.
   A janela é transparente por color-key: tudo o que for EXATAMENTE
   --key desaparece; o pill desenha-se por cima com cantos CSS reais. */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  overflow: hidden;
  user-select: none;
  cursor: default;
  background: #0D0B0A; /* = color key da janela (transparente no ecrã) */
}
#pill {
  --ink: #EDE4D3;
  --dim: #57493A;
  --amber: #E9A13B;
  --ok: #97B473;
  --rec: #E4523B;
  position: absolute;
  inset: 0;
  background: #171210;
  border: 1px solid rgba(237, 228, 211, 0.10);
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 16px;
}
#bars {
  display: flex;
  align-items: center;
  gap: 3px;
  height: 22px;
  width: 100%;
}
#bars i {
  flex: 1;
  min-width: 2px;
  height: 3px;
  border-radius: 2px;
  background: var(--dim);
  transition: height 80ms linear, background .35s ease;
}

/* a gravar: barras acesas ao nível real do micro */
body.recording #bars i { background: var(--ink); }

/* a processar (transcrever/polir/escrever): respiração suave */
body.transcribing #bars i,
body.enhancing #bars i,
body.typing #bars i {
  background: var(--amber);
  animation: breathe 1.4s ease-in-out calc(var(--d) * -1.4s) infinite;
}
@keyframes breathe {
  0%, 100% { height: 3px; opacity: .45; }
  50% { height: 12px; opacity: 1; }
}

/* desfecho: um piscar de cor e o pill esconde-se logo a seguir */
body.error #bars i {
  background: var(--rec);
  height: 3px !important;
  animation: none;
}

@media (prefers-reduced-motion: reduce) {
  #bars i { animation: none !important; }
}
</style>
</head>
<body class="idle">
  <div id="pill"><div id="bars"></div></div>

<script>
"use strict";
const N = 21;
const barsEl = document.getElementById("bars");
barsEl.innerHTML = Array.from({ length: N }, (_, i) =>
  `<i style="--d:${(i / N).toFixed(3)}"></i>`).join("");
const bars = [...barsEl.children];
const buf = new Array(N).fill(0);

const ov = {
  state(s) {
    document.body.className = s;
    if (s !== "recording") {
      buf.fill(0);
      if (s === "idle") ov._paint();
    }
  },
  // nível real do microfone (0..1) — onda deslizante direita→esquerda
  level(v) {
    buf.push(Math.min(1, Math.pow(Math.max(0, v) * 8, 0.7)));
    buf.shift();
    ov._paint();
  },
  _paint() {
    for (let i = 0; i < N; i++) {
      bars[i].style.height = Math.max(3, Math.round(buf[i] * 20)) + "px";
    }
  },
};
window.ov = ov;
</script>
</body>
</html>
